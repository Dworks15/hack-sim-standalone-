<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none';">
<title>HILXITER WEB</title>
<style>
  :root{
    --bg:#000; --fg:#0f0; --dim:#063; --bar:#0f0;
    color-scheme: dark;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px);
  }
  button:focus-visible,input:focus-visible{ outline:2px solid #fff; outline-offset:2px; }
  *{box-sizing:border-box;}
  html,body{
    height:100%; margin:0; background:var(--bg); color:var(--fg);
    font-family: 'Courier New', monospace;
  }
  #wrap{
    max-width:700px; margin:0 auto; padding:24px 16px;
  }
  h1{
    font-size: clamp(16px,4vw,22px);
    text-align:center;
    text-shadow: 0 0 8px var(--fg);
    margin-bottom: 4px;
  }
  .sub{ text-align:center; color:#5f5; font-size:12px; margin-bottom:20px; opacity:.7;}
  .manga-page{ background:#f4f3ee; border:4px solid #111; border-radius:2px; padding:14px; display:grid; gap:10px; filter:grayscale(1); }
  .manga-panel{ background:#fff; border:2px solid #111; border-radius:0; position:relative; padding:18px 14px 14px; min-height:90px; font-family:Georgia, 'Times New Roman', serif; box-shadow:3px 3px 0 #000; }
  .manga-panel .pnum{ position:absolute; top:4px; left:8px; font-size:9px; color:#777; letter-spacing:1px; text-transform:uppercase; }
  .char-halftone{ background-image:radial-gradient(#000 1px, transparent 1.2px); background-size:6px 6px; background-color:#eee; border-radius:50%; display:inline-block; padding:4px; }
  .manga-bubble{ background:#fff; color:#111; border:1.5px solid #111; border-radius:50% / 40%; padding:12px 16px; font-size:13px; line-height:1.5; display:block; max-width:85%; margin:0 auto; text-align:center; position:relative; }
  .manga-bubble:after{ content:""; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%); border-width:10px 8px 0 8px; border-style:solid; border-color:#111 transparent transparent transparent; }
  .manga-bubble:before{ content:""; position:absolute; bottom:-7px; left:50%; transform:translateX(-50%); border-width:8px 6px 0 6px; border-style:solid; border-color:#fff transparent transparent transparent; z-index:1; }
  #term{
    background:#000; border:1px solid var(--dim); border-radius:6px;
    padding:14px; height:300px; overflow-y:auto; font-size:13px; line-height:1.5;
    white-space:pre-wrap; word-break:break-all;
    box-shadow: inset 0 0 20px rgba(0,255,0,0.08);
  }
  #barOuter{
    margin-top:14px; height:18px; background:#021; border:1px solid var(--dim); border-radius:4px; overflow:hidden;
  }
  #barInner{
    height:100%; width:0%; background:var(--bar); box-shadow:0 0 10px var(--bar);
    transition: width .15s linear;
  }
  #pct{ text-align:center; margin-top:6px; font-size:12px;}
  button{
    display:block; margin:18px auto 0; background:#000; color:var(--fg);
    border:1px solid var(--fg); padding:10px 22px; font-family:inherit;
    cursor:pointer; border-radius:4px; font-size:14px;
  }
  button:hover{ background:var(--fg); color:#000; }
  button:disabled{ opacity:.4; cursor:default; }
  .cursor{ display:inline-block; width:8px; background:var(--fg); animation: blink 1s steps(1) infinite;}
  @keyframes blink{ 50%{ opacity:0; } }
  #menu{ display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-bottom:16px; }
  #menu button{ margin:0; font-size:12px; padding:8px 12px; }
  #menu button.active{ background:var(--fg); color:#000; }
  /* ruang kosong di bawah supaya konten tidak tertutup badge "Powered by Netlify" */
  #wrap{ padding-bottom: calc(110px + env(safe-area-inset-bottom,0px)); }
  @media (max-width:600px){
    #aiLayout{ flex-direction:column; width:100%; }
    #aiSidebar{ width:100% !important; flex-direction:row !important; flex-wrap:wrap; }
    #aiSidebar > button{ flex:1 1 auto; }
    #chatList{ flex-direction:row !important; flex-wrap:wrap; max-height:none !important; flex-basis:100%; }
    #chatList button{ max-width:48%; }
    #aiChat{ max-height:50vh !important; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1 id="title">HILXITER WEB</h1>
  <div class="sub">✅ Katalog anime, film, dan AI tanya-jawab orisinal</div>
  <div id="menu">
    <button class="mbtn active" data-mode="anime">🎌 Baca Anime</button>
    <button class="mbtn" data-mode="film">🎬 Baca Film</button>
    <button class="mbtn" data-mode="ai">🤖 AI Tanya-Jawab</button>
  </div>
  <div id="term"></div>
  <div id="barOuter"><div id="barInner"></div></div>
  <div id="pct">0%</div>
  <button id="startBtn">MULAI</button>

  <div id="animeBox" style="display:none; margin-top:18px;">
    <div style="color:#5f5; font-size:12px; margin-bottom:8px;">📺 Katalog Anime Orisinal (tulisan)</div>
    <div id="seriesList" style="display:flex; flex-direction:column; gap:8px;"></div>
    <div id="epList" style="display:none; flex-direction:column; gap:8px; margin-top:10px;"></div>
    <div id="epStory" style="display:none; margin-top:12px; background:#021; border:1px solid var(--dim); border-radius:6px; padding:12px; font-size:12px; line-height:1.6; white-space:pre-wrap;"></div>
    <button id="backBtn" style="display:none; margin:10px auto 0; font-size:11px; padding:6px 12px;">← Kembali</button>
  </div>

  <div id="aiBox" style="display:none; margin-top:18px;">
    <div style="color:#5f5; font-size:12px; margin-bottom:8px;">🤖 AI Tanya-Jawab — tanya apa saja, bisa kirim gambar</div>
    <div id="aiLayout" style="display:flex; gap:10px; align-items:flex-start;">
      <div id="aiSidebar" style="width:110px; flex-shrink:0; display:flex; flex-direction:column; gap:6px;">
        <button id="newChatBtn" style="margin:0; font-size:11px; padding:7px 4px;">+ Chat Baru</button>
        <button id="delChatBtn" style="margin:0; font-size:11px; padding:6px 4px;">🗑 Hapus</button>
        <div id="chatList" style="display:flex; flex-direction:column; gap:4px; max-height:300px; overflow-y:auto;"></div>
      </div>
      <div style="flex:1; min-width:0;">
        <div id="aiChat" style="display:flex; flex-direction:column; gap:8px; max-height:280px; overflow-y:auto; margin-bottom:8px;"></div>
        <div id="imgPreview" style="display:none; margin-bottom:6px;"></div>
        <div style="display:flex; gap:6px;">
          <input id="aiInput" type="text" placeholder="Ketik pertanyaanmu..." style="flex:1; min-width:0; background:#000; color:var(--fg); border:1px solid var(--dim); border-radius:4px; padding:8px; font-family:inherit; font-size:12px;">
          <label style="margin:0; padding:8px 10px; font-size:14px; border:1px solid var(--fg); border-radius:4px; cursor:pointer;">📎<input id="aiImgInput" type="file" accept="image/*" style="display:none;"></label>
          <button id="aiSendBtn" style="margin:0; padding:8px 14px; font-size:12px;">Kirim</button>
        </div>
      </div>
    </div>
  </div>

  <div id="filmBox" style="display:none; margin-top:18px;">

  animeSeries: [
    { title:"NEONKAZE", desc:"Penjaga mercusuar & robot yang menyimpan ingatan kota tenggelam", episodes:[
      { t:"Ep 1: Angin yang Mengingat", s:"Di tepi laut yang selalu berkabut, Rin menjaga mercusuar tua peninggalan neneknya. Rumah kecil di bawah mercusuar itu penuh debu buku dan peta laut yang sudah menguning. Setiap pagi Rin bangun sebelum matahari terbit untuk memeriksa lensa lampu utama. Ia membersihkan kaca itu dengan kain yang sama yang dulu dipakai neneknya. Sudah lama tak ada kapal lewat di perairan ini sejak jalur pelayaran dipindah. Namun Rin tetap menyalakan lampu itu setiap malam tanpa pernah absen. Ia percaya cahaya itu masih ditunggu oleh sesuatu di dasar laut. Tetangga-tetangganya sering menganggap kebiasaan itu aneh, tapi Rin tidak peduli. Neneknya dulu selalu berkata bahwa laut punya ingatan sendiri. Suatu pagi yang berkabut tebal, ombak membawa sesosok benda besar ke tepi pantai. Rin mendekat dengan hati-hati, membawa tongkat kayu untuk berjaga-jaga. Ternyata itu adalah robot karat berukuran seperti anak kecil. Salah satu matanya masih menyala redup, berkedip lemah seperti lampu sekarat. Rin menyeretnya pelan-pelan menembus pasir basah menuju gudang mercusuar. Tubuhnya berat dan dipenuhi kerang serta lumut laut yang menempel lama. Rin menghabiskan waktu berjam-jam membersihkan karat di sendi-sendinya satu per satu. Ia menemukan panel kecil di punggung robot itu yang tersembunyi di balik pelat logam. Dengan hati-hati ia membuka panel itu menggunakan obeng tua milik ayahnya. Di dalamnya terdapat baterai usang yang sudah benar-benar kosong. Rin berlari ke gudang mencari baterai cadangan yang biasa dipakai untuk lampu mercusuar. Ia mencoba beberapa ukuran sebelum menemukan yang pas dengan slot robot itu. Butuh waktu hampir sehari penuh sebelum mata robot itu berkedip stabil. Perlahan cahaya di matanya menguat hingga bersinar penuh dan jernih. Tubuh robot itu bergetar pelan, lalu mengeluarkan suara berderak seperti radio tua yang baru dinyalakan. “Na… ma… ku Toko,” katanya tersendat-sendat, mencoba menyesuaikan suaranya sendiri. Rin terkejut namun juga penasaran, lalu duduk di depannya menunggu kalimat berikutnya. Toko tidak langsung bicara tentang dirinya sendiri atau dari mana ia berasal. Alih-alih begitu, ia mulai bicara tentang sebuah kota yang tenggelam seratus tahun lalu. Kota itu dulunya berdiri tepat di bawah ombak yang setiap hari dipandangi Rin dari puncak mercusuar. Toko menjelaskan bahwa kota itu tenggelam akibat gempa besar yang mengguncang garis pantai. Banyak penduduknya tidak sempat menyelamatkan apa pun selain nyawa mereka sendiri. “Aku disuruh mengingat,” kata Toko pelan namun mantap, “supaya kota itu tidak benar-benar hilang.” Rin bertanya siapa yang menyuruhnya, namun Toko hanya menggeleng lemah, mengaku ingatannya sendiri juga tidak utuh. Malam itu, Rin menatap horizon laut lebih lama dari biasanya, memikirkan kota yang tak pernah ia lihat. Untuk pertama kalinya sejak neneknya tiada, menyalakan mercusuar terasa bukan sekadar kebiasaan turun-temurun. Ia merasa seolah-olah ada tugas baru yang diam-diam diwariskan kepadanya malam itu. Toko duduk di sampingnya, memandang laut yang sama dengan mata yang kini bersinar stabil. Keduanya diam cukup lama, hanya ditemani suara ombak dan deru angin malam. Rin akhirnya bertanya pelan, “Apa kamu akan baik-baik saja di sini?” Toko mengangguk kaku, menjawab bahwa ia tidak punya tempat lain untuk dituju. Rin tersenyum tipis dan berkata bahwa mercusuar ini cukup besar untuk mereka berdua. Sejak malam itu, Toko mulai tinggal bersama Rin di rumah kecil bawah mercusuar. Setiap malam, saat lampu dinyalakan, Toko akan duduk di jendela memandangi laut dalam diam. Rin merasa, entah kenapa, rumahnya yang dulu sepi kini terasa sedikit lebih hidup." },
      { t:"Ep 2: Peta yang Tidak Selesai", s:"Beberapa hari berlalu sejak Toko mulai tinggal bersama Rin di mercusuar tua itu. Setiap pagi, Toko membantu Rin membersihkan lensa dan merapikan buku-buku catatan neneknya. Suatu sore, saat hujan turun deras di luar, Toko tiba-tiba terdiam di tengah pekerjaannya. Ia membuka panel kecil di dadanya yang selama ini jarang disentuh. Dari panel itu muncul cahaya biru pucat yang membentuk proyeksi tiga dimensi di udara. Rin terkejut dan mendekat perlahan, matanya membelalak melihat gambar yang terbentuk. Proyeksi itu menampilkan sebuah peta kota lengkap dengan jalanan berliku dan taman-taman kecil. Di tengah peta berdiri menara jam besar yang tampak menjadi pusat kota itu dulu. Namun separuh dari peta tersebut hanya menampilkan statis abu-abu yang berkedip-kedip. Bagian itu terlihat seperti halaman buku yang robek dan hilang selamanya. “Kenapa tidak lengkap?” tanya Rin sambil duduk bersila di lantai kayu mercusuar. Toko terdiam sejenak sebelum menjawab, suaranya terdengar lebih pelan dari biasanya. “Karena aku tidak sempat menghafal semuanya,” jawab Toko, nada suaranya terdengar berat. “Saat air mulai naik, aku hanya punya waktu menyelamatkan setengah kota dalam ingatanku.” Toko menjelaskan bahwa saat itu sinyalnya mulai terputus-putus akibat air yang merembes ke sirkuitnya. Ia berusaha merekam sebanyak mungkin sebelum kesadarannya benar-benar padam di dasar laut. Rin mendengarkan dengan seksama, merasakan beban yang selama ini dipikul oleh robot kecil itu. Ruangan mercusuar terasa hening, hanya suara hujan yang memukul kaca jendela. Rin menunduk memandangi peta yang bolong itu untuk waktu yang cukup lama. Tiba-tiba matanya berbinar seolah teringat sesuatu yang penting. Ia bangkit cepat dan berlari menuju gudang kecil di belakang rumah mercusuar. Toko memanggilnya namun Rin sudah menghilang di balik pintu kayu yang berderit. Beberapa menit kemudian Rin kembali sambil membawa sebuah buku tebal berdebu. Itu adalah buku catatan tua milik neneknya yang selama ini tersimpan rapi di lemari. Sampul buku itu sudah usang namun tulisan tangan di dalamnya masih dapat dibaca jelas. Buku itu penuh dengan sketsa kota lama yang pernah diceritakan turun-temurun di keluarga Rin. Neneknya dulu sering bercerita tentang kota itu sebelum Rin tidur setiap malam. Rin duduk kembali di depan Toko dan mulai membuka halaman pertama buku itu. Ia membacakan deskripsi jalan-jalan kecil yang pernah digambar oleh neneknya dengan detail. Setiap kali Rin membacakan satu bagian, bagian peta yang kosong pada proyeksi Toko perlahan mulai terisi. Warna-warna mulai muncul menggantikan statis abu-abu yang sebelumnya menutupi sebagian kota. Toko menatap fenomena itu dengan takjub, matanya berkedip lebih cepat dari biasanya. “Bagaimana ini bisa terjadi?” tanya Toko dengan nada penuh keheranan. Rin tersenyum sambil terus membalik halaman demi halaman buku catatan itu. “Mungkin ingatan tidak harus berasal dari satu sumber saja,” jawab Rin pelan. Mereka berdua melanjutkan proses itu hingga larut malam, tanpa merasa lelah sedikit pun. Setiap cerita yang dibacakan Rin menambah detail baru pada peta kota yang tenggelam. Perlahan tapi pasti, bagian yang kosong semakin menyempit dan menyempit lagi. Toko mulai mengenali beberapa tempat yang disebutkan dalam buku itu dari ingatannya sendiri. Kombinasi antara ingatan Toko dan cerita turun-temurun keluarga Rin membentuk gambaran yang semakin utuh. Menjelang dini hari, peta itu hampir seluruhnya terisi, hanya menyisakan sedikit bagian kosong di sudut. Rin menguap lebar namun matanya tetap bersinar penuh semangat memandangi hasil kerja mereka. Toko menatap peta yang kini hampir sempurna dengan perasaan campur aduk. “Terima kasih,” katanya pelan, suaranya terdengar lebih hangat dari sebelumnya. Rin menggeleng dan berkata bahwa dialah yang seharusnya berterima kasih atas cerita baru ini. Malam itu mereka berdua tertidur di lantai mercusuar, dikelilingi proyeksi peta kota yang perlahan menjadi lengkap." },
      { t:"Ep 3: Cahaya untuk Kota Tenggelam", s:"Pagi setelah peta itu selesai, Rin terbangun dengan perasaan yang berbeda dari biasanya. Ia menatap proyeksi peta kota yang masih menyala lembut di tengah ruangan. Toko duduk di sampingnya, tampak sudah terjaga sejak dini hari, menatap peta itu tanpa henti. “Aku terus memikirkannya semalaman,” kata Toko begitu melihat Rin bangun. “Memikirkan apa?” tanya Rin sambil menggosok matanya yang masih mengantuk. “Bagaimana caranya supaya kota itu tahu kita masih mengingatnya,” jawab Toko pelan. Rin terdiam, memikirkan kata-kata Toko sambil memandangi laut dari jendela kecil. Sepanjang hari itu, Rin sibuk mencari-cari sesuatu di gudang penyimpanan mercusuar. Toko mengikutinya, membantu memindahkan kotak-kotak berat yang sudah lama tidak disentuh. Di sudut gudang paling dalam, Rin menemukan sebuah peti kayu tua terkunci rapat. Dengan kunci yang disimpan neneknya dahulu, Rin berhasil membuka peti tersebut perlahan. Di dalamnya tersimpan sebuah lensa kaca besar berwarna biru pekat yang berkilau aneh. Neneknya pernah bercerita bahwa kaca itu adalah lensa khusus buatan generasi sebelumnya. Konon kaca itu mampu memancarkan cahaya yang bisa menembus air laut jauh lebih dalam dari cahaya biasa. Rin belum pernah melihat kaca itu digunakan sepanjang hidupnya tinggal di mercusuar. Ia mengangkat lensa itu hati-hati, merasakan beratnya yang jauh melebihi ukurannya. Toko memandangi kaca itu dengan penuh rasa ingin tahu, matanya berkedip-kedip pelan. “Menurutmu ini bisa membantu?” tanya Rin sambil menatap Toko penuh harap. Toko mengangguk perlahan, meski ia sendiri tidak sepenuhnya yakin akan hasilnya. Sepanjang sore itu mereka berdua bekerja sama memasang lensa biru pada tempat lampu utama. Prosesnya tidak mudah karena ukuran lensa lama harus disesuaikan dengan dudukan yang ada. Rin mengencangkan setiap baut dengan hati-hati, sementara Toko memegangi lensa agar tidak bergeser. Matahari mulai tenggelam saat pekerjaan mereka hampir selesai, mewarnai langit dengan jingga keemasan. Rin menyeka keringat di dahinya sambil memandangi hasil kerja mereka dengan puas. “Sekarang tinggal menunggu malam tiba,” katanya sambil tersenyum kepada Toko. Mereka berdua duduk di tangga mercusuar, menunggu langit benar-benar gelap sambil berbincang. Toko bercerita lebih banyak tentang serpihan ingatannya mengenai kota yang tenggelam itu. Ia menceritakan tentang taman kota yang ramai anak-anak bermain di sore hari. Rin mendengarkan dengan seksama, membayangkan kehidupan yang dulu pernah ada di bawah laut itu. Ketika malam akhirnya tiba, Rin berdiri dan mengajak Toko naik ke puncak mercusuar bersama-sama. Toko kini sudah bisa berjalan sendiri meski masih agak kaku di beberapa sendinya. Mereka berdua menaiki tangga spiral yang berderit di bawah langkah kaki mereka. Sesampainya di puncak, angin malam menyambut mereka dengan kencang dan dingin. Rin mendekati sakelar utama lampu mercusuar, tangannya sedikit gemetar karena gugup. “Untuk apa sebenarnya ini?” tanya Toko sekali lagi, ingin memastikan maksud Rin. “Supaya kota itu tahu,” jawab Rin sambil menatap laut gelap di hadapan mereka, “bahwa masih ada yang mengingatnya dari atas sini.” Dengan satu tarikan napas dalam, Rin menyalakan sakelar yang telah lama tidak disentuh itu. Cahaya biru terang langsung memancar kuat, menembus kegelapan malam dengan intensitas luar biasa. Sinar itu menembus permukaan laut, turun perlahan menuju kedalaman yang tak terjangkau mata manusia. Rin dan Toko berdiri terpaku menyaksikan cahaya itu menghilang ke dalam gelapnya air. Beberapa saat berlalu tanpa ada tanda-tanda apa pun selain riak ombak yang tenang. Namun tiba-tiba, karat di sekujur tubuh Toko mulai bersinar lemah, seolah merespons sesuatu. Rin terkejut dan segera memeriksa kondisi Toko yang tampak baik-baik saja. “Aku merasakannya,” bisik Toko pelan, matanya berkaca-kaca meski ia tak memiliki air mata sungguhan. Jauh di dasar laut, menara jam kota lama tampak memantulkan cahaya biru itu kembali. Seolah-olah kota yang telah lama hilang itu membalas sinyal dari permukaan dengan caranya sendiri. Rin tersenyum lebar sambil memandangi laut yang kini tak lagi terasa kosong baginya. Ia merasa seperti sedang menyaksikan sebuah percakapan antara dua dunia yang terpisah waktu. Malam itu, mereka berdua duduk lama di puncak mercusuar, membiarkan cahaya biru terus menyala. Rin menyandarkan kepalanya di bahu Toko yang kini terasa hangat meski terbuat dari logam. “Terima kasih sudah membawaku kembali,” kata Toko pelan, suaranya penuh ketulusan. “Terima kasih sudah mengingatkanku bahwa cahaya ini punya tujuan,” balas Rin sambil tersenyum. Sejak malam itu, mercusuar tua itu tidak lagi hanya memandu kapal yang sudah lama tak lewat. Ia menemukan tugas barunya: menjaga sebuah kota yang kini, berkat Toko dan Rin, tidak akan pernah benar-benar pergi dari ingatan. — TAMAT Season 1 —" }
    ]},
    { title:"KERTAS & RODA GIGI", desc:"Seorang tukang pos remaja menemukan surat dari masa depan", episodes:[
      { t:"Ep 1: Surat Salah Alamat", s:"Haru adalah seorang remaja tujuh belas tahun yang bekerja paruh waktu sebagai tukang pos di kota kecilnya. Setiap pagi ia mengayuh sepeda tuanya menyusuri jalanan sempit menuju kantor pos di pusat kota. Pekerjaannya sederhana, hanya mengantarkan surat dan paket ke rumah-rumah warga setiap hari. Haru menyukai pekerjaan ini karena ia bisa mengenal hampir semua orang di kotanya. Suatu pagi yang biasa, ia tiba di kantor pos seperti biasa untuk mengambil tumpukan surat hari itu. Kepala kantor pos menyerahkan setumpuk amplop yang harus diantarkan sebelum siang hari. Haru menyortir surat-surat itu satu per satu sesuai alamat tujuan masing-masing. Di tengah tumpukan itu, ia menemukan sebuah amplop dengan alamat yang sangat familiar baginya. Alamat itu adalah alamat rumahnya sendiri, lengkap dengan nama penerima yang juga namanya sendiri. Haru mengira ini mungkin surat dari saudara jauh atau kesalahan pengetikan biasa. Namun yang membuatnya bingung adalah tanggal pengiriman yang tertera di prangko surat itu. Tanggal itu menunjukkan sepuluh tahun ke depan dari hari ini, sesuatu yang mustahil secara logika. Haru memeriksa amplop itu berkali-kali, mengira matanya salah membaca angka tersebut. Namun semakin ia perhatikan, semakin jelas bahwa tanggal itu memang benar tertulis demikian. Dengan rasa penasaran yang besar, Haru memutuskan untuk membuka surat itu di tempat kerja. Tangannya sedikit gemetar saat merobek pinggiran amplop yang sudah terlihat usang. Di dalamnya terdapat selembar kertas dengan tulisan tangan yang sangat mirip dengan tulisannya sendiri. Haru mulai membaca isi surat itu dengan jantung berdebar kencang. Surat itu dibuka dengan sapaan aneh, “Halo, ini aku, dari sepuluh tahun ke depan.” Haru hampir tertawa membaca kalimat pembuka itu, mengira ini lelucon dari temannya. Namun semakin ia membaca, semakin banyak detail yang hanya diketahui oleh dirinya sendiri. Surat itu menyebutkan nama kucing peliharaannya yang baru saja ia adopsi minggu lalu. Tidak ada orang lain yang tahu tentang kucing itu selain Haru dan keluarganya sendiri. Surat itu juga menyebutkan mimpi yang Haru alami tiga hari lalu, yang belum pernah ia ceritakan kepada siapa pun. Tangan Haru mulai gemetar hebat, menyadari bahwa ini bukanlah lelucon biasa. Ia membaca lebih lanjut, dan surat itu memperingatkannya tentang sebuah keputusan penting yang akan datang. “Jangan menyerah pada impianmu menjadi arsitek,” tulis surat itu dengan tegas. Haru terdiam, karena belakangan ini ia memang mulai ragu dengan cita-citanya sendiri. Orang tuanya selalu mendorongnya untuk mengambil pekerjaan yang lebih stabil di kantor pos. Surat itu seolah tahu persis apa yang sedang bergejolak dalam pikiran Haru saat ini. Ia melipat surat itu perlahan, mencoba mencerna semua yang baru saja dibacanya. Haru memutuskan untuk tidak mengantarkan surat-surat lainnya dulu dan duduk di bangku taman terdekat. Ia membaca surat itu sekali lagi dari awal, mencari petunjuk tentang siapa pengirim sebenarnya. Di bagian bawah surat, terdapat tanda tangan yang sangat mirip dengan tanda tangannya sendiri saat ini. Namun tanda tangan itu terlihat sedikit berbeda, lebih matang dan lebih mantap goresannya. Haru menatap langit sore yang mulai berubah warna, pikirannya dipenuhi berbagai pertanyaan. Bagaimana mungkin surat ini bisa sampai kepadanya jika pengirimnya adalah dirinya sendiri di masa depan. Apakah ini semacam keajaiban, ataukah ada penjelasan ilmiah yang belum ia pahami. Haru memasukkan surat itu ke dalam saku jaketnya dengan hati-hati, takut kertas itu rusak. Sepanjang sisa hari itu, pikirannya terus melayang pada kata-kata dalam surat misterius tersebut. Ketika malam tiba, Haru duduk di kamarnya memandangi surat itu di bawah cahaya lampu meja. Ia bertanya-tanya apakah akan ada surat lain yang datang setelah ini. Dengan perasaan campur aduk antara takut dan penasaran, Haru menyimpan surat itu di laci mejanya. Ia berjanji pada dirinya sendiri untuk mencari tahu kebenaran di balik surat aneh ini. Malam itu, untuk pertama kalinya dalam beberapa minggu, Haru tidur dengan pikiran penuh harapan tentang masa depannya." },
      { t:"Ep 2: Jawaban yang Belum Ditulis", s:"Beberapa hari berlalu sejak Haru menerima surat misterius itu di kantor pos. Setiap malam ia duduk di mejanya, memandangi surat itu dengan berbagai pikiran berkecamuk. Akhirnya ia memutuskan untuk mencoba membalas surat aneh tersebut malam itu juga. Haru mengambil selembar kertas kosong dan pena favoritnya dari laci meja. Ia duduk diam sejenak, bingung harus memulai kalimat pertama seperti apa. Setelah beberapa menit berpikir, ia mulai menulis, “Halo, ini aku, yang sepuluh tahun lebih muda.” Tangannya bergerak lancar menuliskan kalimat demi kalimat yang ingin ia sampaikan. Namun ketika ia berhenti sejenak untuk membaca ulang, sesuatu yang aneh terjadi. Kata-kata yang baru saja ditulisnya tampak berubah posisi di atas kertas. Haru mengucek matanya, mengira ia hanya lelah dan salah lihat saja. Namun ketika ia perhatikan lebih seksama, kalimat itu benar-benar sudah berbeda dari sebelumnya. Kalimat yang tadinya bertanya tentang masa depan kini berubah menjadi pernyataan berbeda. Haru merasakan bulu kuduknya berdiri, namun rasa penasarannya jauh lebih besar dari rasa takutnya. Ia mencoba menulis kalimat lain, kali ini tentang keraguannya soal menjadi arsitek. Begitu tinta kering, kalimat itu kembali berubah dengan sendirinya di depan matanya. Kata-kata yang tadinya ragu kini berubah menjadi lebih yakin dan penuh semangat. Haru menyadari bahwa seolah-olah dirinya di masa depan ikut mengoreksi tulisannya saat ini. Ia mencoba lagi dengan pertanyaan langsung, “Apakah kau benar-benar aku dari masa depan?” Kalimat itu bertahan sesaat sebelum perlahan kata-katanya mulai memudar dan digantikan tulisan baru. Tulisan baru itu berbunyi, “Pertanyaan yang lebih penting adalah, apa yang akan kau lakukan sekarang?” Haru terpaku membaca kalimat itu, merasa seperti sedang berdialog langsung dengan dirinya sendiri. Ia mencoba menulis lagi, menanyakan bagaimana caranya surat ini bisa berubah dengan sendirinya. Jawaban yang muncul hanya berupa kalimat singkat, “Beberapa hal tidak perlu dijelaskan, cukup dijalani.” Haru merasa frustrasi sekaligus terpesona dengan fenomena aneh yang sedang ia alami. Ia menghabiskan berjam-jam mencoba berbagai pertanyaan, namun jawabannya selalu singkat dan penuh teka-teki. Malam semakin larut, namun Haru tidak merasa mengantuk sedikit pun karena rasa penasarannya. Ia mulai menulis tentang ketakutannya mengecewakan orang tuanya jika memilih jalur seni. Kali ini, kata-katanya tidak berubah, melainkan muncul tambahan kalimat di bawahnya. Tambahan itu berbunyi, “Orang tua kita akhirnya bangga, meski butuh waktu lama untuk sampai ke sana.” Mata Haru mulai berkaca-kaca membaca kalimat itu, merasa mendapat semacam penghiburan. Ia menulis lagi, menanyakan apakah keputusannya nanti akan sulit dijalani. Jawaban yang muncul berbunyi, “Semua keputusan besar terasa sulit sebelum dijalani, bukan sesudahnya.” Haru menutup bukunya sejenak, mencoba mencerna semua percakapan aneh yang baru saja terjadi. Ia menatap jendela kamarnya, melihat bulan yang bersinar terang di langit malam. Pikirannya dipenuhi pertanyaan tentang bagaimana cara kerja fenomena yang ia alami ini. Apakah suratnya benar-benar terhubung dengan masa depan, ataukah ini hanya imajinasinya semata. Haru memutuskan untuk mencoba sekali lagi sebelum tidur malam itu. Ia menulis pertanyaan terakhir, “Bagaimana aku bisa mengirim surat ini kepadamu?” Kali ini jawabannya cukup panjang, menjelaskan tentang sebuah kotak pos tua di ujung kota. Kotak pos itu konon sudah rusak dan tidak digunakan sejak bertahun-tahun lalu. Namun surat itu menjelaskan bahwa kotak itu sebenarnya memiliki kemampuan khusus yang jarang diketahui orang. Haru membaca penjelasan itu berulang kali, mencoba memahami setiap detailnya dengan saksama. Ia memutuskan bahwa besok pagi ia akan pergi memeriksa kotak pos tua tersebut sendiri. Dengan perasaan campur aduk antara gugup dan bersemangat, Haru akhirnya memutuskan untuk tidur. Surat balasannya tersimpan rapi di atas meja, menunggu untuk dikirimkan esok hari. Malam itu, mimpi Haru dipenuhi gambaran tentang kotak pos misterius yang menembus waktu." },
      { t:"Ep 3: Kotak Pos Waktu", s:"Pagi itu Haru bangun lebih awal dari biasanya, bersemangat untuk memeriksa kotak pos misterius tersebut. Ia mengambil surat balasannya dari meja dan memasukkannya hati-hati ke dalam tas sepeda. Dengan sepeda tuanya, Haru mengayuh menuju ujung kota tempat kotak pos itu berada. Perjalanan itu memakan waktu hampir setengah jam melewati jalanan yang semakin sepi. Ia melewati bekas pabrik tua dan rel kereta yang sudah lama tidak digunakan. Akhirnya ia tiba di sebuah persimpangan sunyi tempat kotak pos berwarna merah pudar berdiri. Kotak itu terlihat sangat usang, catnya mengelupas di beberapa bagian dan berkarat di sudut-sudutnya. Banyak warga kota menganggap kotak pos itu sudah tidak berfungsi sejak bertahun-tahun silam. Haru turun dari sepedanya dan berjalan mendekat dengan hati berdebar kencang. Ia memeriksa kotak itu dari luar, mencari tanda-tanda bahwa kotak ini memang istimewa. Tidak ada yang terlihat berbeda dari kotak pos biasa pada umumnya dari luar. Namun Haru teringat kata-kata dalam surat balasannya semalam tentang kotak ini. Dengan tangan gemetar, ia membuka tas dan mengeluarkan surat yang telah ia tulis semalam. Haru menatap surat itu sekali lagi, memastikan ia tidak salah menuliskan alamat pengirimnya. Ia menuliskan namanya sendiri sebagai penerima, dengan tanggal sepuluh tahun ke depan seperti instruksi dalam surat. Dengan napas tertahan, Haru memasukkan surat itu ke dalam celah kotak pos tua tersebut. Begitu surat itu masuk sepenuhnya, kotak pos itu bergetar pelan, hampir tak terasa. Cahaya samar berwarna keemasan sempat berkelebat dari celah kotak selama sepersekian detik. Haru mundur selangkah, terkejut sekaligus takjub dengan apa yang baru saja ia saksikan. Ia menunggu beberapa saat, berharap ada sesuatu yang terjadi setelah itu. Namun kotak pos itu kembali diam, seolah tidak ada hal aneh yang terjadi sebelumnya. Haru menghela napas panjang, campur antara kecewa dan masih penuh keyakinan. Ia memutuskan untuk menunggu di dekat kotak itu selama beberapa menit lagi. Sambil menunggu, pikirannya melayang pada semua percakapan yang terjadi semalam melalui surat tersebut. Ia teringat kalimat tentang orang tuanya yang akhirnya bangga dengan pilihannya nanti. Kalimat itu memberinya keberanian yang belum pernah ia rasakan sebelumnya mengenai masa depannya. Haru berdiri dari duduknya dan mulai berjalan mengelilingi kotak pos tua itu. Ia memperhatikan ukiran kecil di bagian bawah kotak yang hampir tidak terlihat karena karat. Ukiran itu bertuliskan tahun pembuatan kotak pos tersebut, lebih dari seratus tahun yang lalu. Haru merasa kagum membayangkan berapa banyak surat yang pernah melewati kotak kuno ini. Ia kembali duduk di trotoar dekat kotak pos, memandangi langit pagi yang cerah. Dalam hati ia bertanya-tanya, apakah suratnya benar-benar akan sampai ke dirinya sendiri kelak. Ataukah ini semua hanya kebetulan aneh yang tidak memiliki penjelasan logis sama sekali. Namun apapun jawabannya, Haru merasa pengalaman ini telah mengubah caranya memandang masa depan. Ia bangkit berdiri dan memutuskan untuk pulang dengan hati yang jauh lebih ringan. Dalam perjalanan pulang, Haru singgah di toko alat lukis yang selama ini hanya berani ia lewati. Ia masuk dan membeli beberapa pensil serta buku sketsa yang telah lama ia inginkan. Pemilik toko tersenyum ramah melihat semangat baru yang terpancar dari wajah remaja itu. Sesampainya di rumah, Haru langsung duduk di kamarnya dan mulai menggambar sketsa pertamanya. Ia menggambar bangunan impian yang selama ini hanya ada dalam bayangannya saja. Tangannya bergerak lincah di atas kertas, seolah semua keraguan telah hilang sepenuhnya. Malam harinya, Haru menuliskan di buku hariannya tentang semua kejadian luar biasa hari itu. Ia menutup catatannya dengan kalimat, “Entah surat itu benar atau tidak, aku memilih untuk percaya pada diriku sendiri.” Sejak hari itu, Haru rutin mengunjungi kotak pos tua tersebut setiap akhir pekan. Kadang ia menitipkan surat-surat kecil berisi harapan dan mimpi untuk dirinya sendiri di masa depan. Ia tidak pernah tahu pasti apakah surat-surat itu benar-benar sampai atau tidak. Namun setiap kali menulis, Haru merasa semakin yakin dengan jalan yang ia pilih. Bertahun-tahun kemudian, seorang arsitek muda bernama Haru membuka kantornya sendiri di kota yang sama. Di salah satu laci mejanya, tersimpan rapi sebuah surat tua yang pernah mengubah hidupnya selamanya. — TAMAT Season 1 —" }
    ]},
    { title:"GEMA TERAKHIR", desc:"Pemain biola yang bisa mendengar perasaan orang lewat musik", episodes:[
      { t:"Ep 1: Nada yang Tak Terucap", s:"Sora adalah seorang siswi kelas dua SMA yang memiliki kemampuan tidak biasa sejak kecil. Ia bisa mendengar emosi orang lain sebagai nada musik yang bergema di kepalanya sendiri. Kemampuan ini muncul pertama kali saat ia berusia tujuh tahun, saat orang tuanya bertengkar hebat di ruang tamu. Sejak saat itu, setiap kali berada dekat seseorang, Sora akan mendengar melodi yang mencerminkan perasaan mereka sebenarnya. Nada gembira terdengar ringan dan mengalun cepat seperti permainan piano riang. Nada sedih terdengar berat dan lambat, seperti gesekan cello yang panjang dan menyayat. Sora belajar menyembunyikan kemampuan ini sejak kecil karena takut dianggap aneh oleh orang-orang sekitarnya. Ia hanya menceritakan rahasia ini kepada neneknya yang telah lama meninggal dunia. Neneknya dulu adalah seorang pemain biola profesional yang mengajarkan Sora dasar-dasar bermain alat musik tersebut. Setiap hari sepulang sekolah, Sora menghabiskan waktu berlatih biola di kamarnya sendirian. Baginya, bermain biola adalah satu-satunya cara untuk mengeluarkan semua nada yang ia dengar dari orang lain. Suatu pagi di hari Senin, Sora berangkat ke sekolah seperti biasa dengan tas biola di punggungnya. Di kelas, ia duduk di bangku paling belakang dekat jendela, kebiasaan yang sudah lama ia jalani. Guru wali kelasnya, Bu Aminah, masuk ke kelas dengan senyum ramah seperti biasanya. Bu Aminah dikenal sebagai guru yang selalu ceria dan penuh semangat dalam mengajar murid-muridnya. Namun pagi itu, saat Bu Aminah mulai menjelaskan pelajaran, Sora mendengar sesuatu yang berbeda. Di balik senyum ramah itu, terdengar nada musik yang sangat sedih dan berat, seperti gesekan cello yang menyayat pelan. Sora terkejut dan menatap gurunya lebih seksama, mencoba memahami apa yang sebenarnya terjadi. Sepanjang pelajaran, nada sedih itu terus terdengar, tidak pernah hilang meski Bu Aminah terus tersenyum. Sora merasa gelisah sepanjang hari, memikirkan apa yang mungkin sedang dialami gurunya tersebut. Ia memperhatikan Bu Aminah lebih dekat selama istirahat, mencoba mencari petunjuk dari perilakunya. Namun Bu Aminah tetap terlihat biasa saja, tertawa dan bercanda dengan guru-guru lain di ruang guru. Hanya Sora yang bisa mendengar kesedihan yang tersembunyi jauh di dalam dirinya. Sepulang sekolah, Sora duduk di bangku taman dekat gerbang sekolah, memikirkan hal itu terus menerus. Ia bertanya-tanya apakah ada cara untuk membantu gurunya tanpa harus mengungkapkan kemampuan anehnya. Hari-hari berikutnya, Sora terus memperhatikan Bu Aminah dengan seksama di setiap kesempatan. Nada sedih itu tidak pernah benar-benar hilang, meski kadang terdengar sedikit lebih ringan di hari-hari tertentu. Suatu sore, Sora melihat Bu Aminah masih berada di sekolah jauh setelah jam pelajaran usai. Ia duduk sendirian di ruang guru yang sudah kosong, menatap setumpuk kertas tugas yang belum selesai diperiksa. Sora mengumpulkan keberanian dan memutuskan untuk mendekati ruang guru tersebut. Ia mengetuk pintu pelan, dan Bu Aminah menoleh dengan sedikit terkejut melihat muridnya masih di sekolah. “Sora? Kenapa belum pulang?” tanya Bu Aminah dengan nada khawatir seperti biasanya. Sora tidak langsung menjawab, hanya berdiri di ambang pintu sambil menatap gurunya dengan ragu. “Bu, apa Ibu baik-baik saja?” tanya Sora akhirnya, suaranya terdengar pelan namun penuh perhatian. Bu Aminah tersenyum, senyum yang sama seperti biasanya namun kali ini terlihat sedikit berbeda di mata Sora. “Tentu saja, kenapa kamu bertanya begitu?” jawab Bu Aminah sambil mencoba terlihat seperti biasa. Sora menatap gurunya lama, merasakan nada sedih itu semakin jelas terdengar di telinganya. Ia tidak tahu harus berkata apa lagi tanpa mengungkapkan rahasia kemampuannya sendiri. Akhirnya Sora hanya mengangguk pelan dan berkata, “Baiklah, Bu. Saya permisi dulu.” Namun sebelum pergi, Sora berhenti sejenak di pintu dan menoleh kembali ke arah gurunya. “Kalau Ibu butuh sesuatu, saya selalu ada,” katanya pelan sebelum akhirnya benar-benar pergi meninggalkan ruangan. Bu Aminah terdiam lama setelah Sora pergi, menatap pintu yang baru saja tertutup dengan pandangan kosong. Dalam perjalanan pulang, Sora terus memikirkan percakapan singkat itu dengan perasaan tidak tenang. Ia merasa ada sesuatu yang besar sedang dipendam oleh gurunya, namun tidak tahu cara membantunya. Malam itu, Sora duduk di kamarnya memegang biola kesayangannya, namun tidak langsung memainkannya. Ia memikirkan nada sedih yang terus terngiang di kepalanya sejak pagi itu. Perlahan, ia mulai memainkan sebuah melodi yang muncul begitu saja dari perasaannya sendiri. Melodi itu terdengar seperti gabungan antara kekhawatiran dan harapan, sesuatu yang ingin ia sampaikan namun tak tahu caranya. Sora bertekad dalam hatinya untuk mencari cara membantu gurunya, meski ia belum tahu bagaimana caranya." },
      { t:"Ep 2: Konser untuk Satu Orang", s:"Beberapa minggu berlalu sejak Sora pertama kali menyadari kesedihan tersembunyi di balik senyum gurunya. Nada sedih itu masih terdengar setiap kali Sora berada dekat Bu Aminah di kelas. Sora mulai mencari informasi lebih lanjut, bertanya pelan-pelan kepada teman-teman sekelasnya tentang Bu Aminah. Salah satu temannya, Rina, menyebutkan bahwa ia pernah mendengar Bu Aminah berbicara tentang mendiang suaminya. Konon suami Bu Aminah meninggal dunia setahun lalu akibat kecelakaan yang terjadi secara mendadak. Sejak saat itu, Bu Aminah mengurus kedua anaknya sendirian sambil tetap mengajar di sekolah setiap hari. Sora merasa hatinya semakin berat mendengar informasi tersebut, memahami sumber kesedihan yang selama ini ia dengar. Ia mulai memikirkan cara untuk menunjukkan dukungan tanpa membuat gurunya merasa dikasihani. Sora teringat kebiasaan sekolahnya yang selalu mengadakan acara pentas seni setiap akhir semester. Acara itu biasanya diisi oleh penampilan musik, tari, dan berbagai pertunjukan dari murid-murid berbakat. Sora yang biasanya menolak tampil di depan umum karena takut kemampuannya terbongkar, kali ini berpikir berbeda. Ia mendaftarkan diri untuk tampil solo biola di acara pentas seni tahun ini. Teman-temannya terkejut karena selama ini Sora selalu menghindari panggung dan perhatian orang banyak. Namun Sora memiliki alasan tersendiri yang belum ia ceritakan kepada siapa pun termasuk teman dekatnya. Setiap malam setelah itu, Sora berlatih lebih keras dari biasanya, menyiapkan sebuah komposisi khusus. Komposisi itu bukan lagu yang sudah ada, melainkan ciptaannya sendiri yang terinspirasi dari nada yang ia dengar. Ia mencoba menerjemahkan kesedihan yang didengarnya dari Bu Aminah menjadi melodi yang penuh harapan. Proses menciptakan lagu itu tidak mudah, Sora harus mengulang bagian yang sama berkali-kali. Ia ingin memastikan setiap nada benar-benar mewakili perasaan yang ingin ia sampaikan kepada gurunya. Neneknya dulu pernah berkata bahwa musik adalah bahasa yang bisa menyampaikan apa yang tak terucap oleh kata-kata. Sora mengingat kalimat itu setiap kali merasa ragu dengan komposisi yang sedang ia buat. Hari demi hari berlalu, dan akhirnya tiba hari pentas seni yang telah lama dinanti seluruh sekolah. Aula sekolah dipenuhi oleh murid-murid, guru-guru, dan beberapa orang tua yang datang menyaksikan acara tersebut. Sora duduk di belakang panggung, jantungnya berdebar kencang menunggu giliran tampil. Ia melihat Bu Aminah duduk di barisan guru, tersenyum menyaksikan penampilan murid-murid lainnya satu per satu. Nada sedih itu masih terdengar jelas di telinga Sora, bahkan di tengah keramaian aula yang penuh tawa. Akhirnya nama Sora dipanggil oleh pembawa acara untuk tampil sebagai penampilan berikutnya. Dengan biola di tangan, Sora melangkah pelan menuju tengah panggung, menatap penonton yang menunggu. Ia mencari sosok Bu Aminah di antara kerumunan, dan menemukan gurunya menatapnya dengan penuh perhatian. Sora menarik napas dalam, menempelkan biola di bahunya, dan mulai memainkan komposisi yang telah lama ia siapkan. Melodi pertama mengalun pelan, lembut namun penuh perasaan, menggambarkan kesedihan yang dalam. Perlahan, nada itu mulai berubah, bertransformasi menjadi melodi yang lebih hangat dan menenangkan. Sora memainkan setiap not dengan sepenuh hati, membayangkan ia sedang berbicara langsung kepada gurunya melalui musik. Seluruh aula menjadi hening, terpukau oleh permainan biola yang begitu menyentuh dari seorang siswi yang biasanya pendiam. Bu Aminah menatap Sora dengan mata yang mulai berkaca-kaca, seolah merasakan sesuatu yang sangat personal dari melodi itu. Musik itu seakan berbicara langsung kepadanya, mengatakan bahwa ia tidak sendirian dalam menghadapi kesedihannya. Sora terus memainkan biolanya hingga nada terakhir mengalun pelan dan akhirnya berhenti sepenuhnya. Hening sejenak sebelum tepuk tangan meriah memenuhi seluruh aula sekolah dengan gemuruh yang hangat. Sora membungkuk pelan, namun matanya langsung mencari sosok Bu Aminah di tengah kerumunan penonton. Ia melihat gurunya berdiri, bertepuk tangan sambil menyeka air mata yang mengalir di pipinya. Setelah acara selesai, Bu Aminah mendekati Sora yang masih berada di belakang panggung merapikan biolanya. “Permainanmu tadi sangat indah, Sora,” kata Bu Aminah dengan suara yang masih sedikit bergetar. “Entah kenapa, lagu itu membuat saya merasa… didengar,” lanjutnya sambil tersenyum tulus kepada muridnya. Sora tersenyum lega, merasa bahwa pesan yang ingin ia sampaikan melalui musik akhirnya tersampaikan dengan baik. “Saya senang Ibu menyukainya,” jawab Sora sederhana, tidak mengungkapkan rahasia di balik komposisi tersebut. Bu Aminah memeluk Sora sejenak, pelukan yang terasa hangat dan penuh rasa terima kasih yang tulus. Sejak hari itu, Sora merasakan perubahan pada nada yang ia dengar setiap kali dekat dengan Bu Aminah. Nada sedih yang dulu begitu berat kini terdengar sedikit lebih ringan, meski belum sepenuhnya hilang. Sora menyadari bahwa musik tidak bisa menghapus kesedihan sepenuhnya, namun bisa menjadi teman untuk menanggungnya bersama. Ia memutuskan untuk terus bermain biola, bukan lagi hanya untuk dirinya sendiri, tapi untuk siapa pun yang membutuhkan didengar. Sejak saat itu, setiap kali ada teman atau guru yang terlihat membawa beban berat, Sora akan menawarkan diri untuk memainkan biola untuk mereka. Bukan konser besar di depan banyak orang, melainkan penampilan kecil dan personal, khusus untuk satu orang yang membutuhkannya. Sora menyebut kebiasaan barunya itu sebagai konser untuk satu orang, caranya sendiri untuk menerjemahkan apa yang tak pernah terucap menjadi melodi yang bisa dirasakan. — TAMAT Season 1 —" }
    ]}

  filmStory: {
    title: "SENJA TERAKHIR DI STASIUN LAMA",
    text: "BABAK SATU. Kota kecil itu selalu diselimuti kabut tipis setiap pagi, terutama di musim penghujan seperti sekarang. Wening bangun pukul enam pagi di apartemennya yang terletak di lantai tiga sebuah gedung sederhana. Ia seorang arsitek muda berusia dua puluh delapan tahun yang baru dua tahun bekerja di firma arsitektur kotanya. Pagi itu terasa berbeda karena ia mendapat tugas besar pertamanya dari atasan langsungnya. Tugas itu adalah merancang pembongkaran stasiun kereta tua di pinggir kota untuk proyek revitalisasi. Wening mengenakan jaket cokelat kesayangannya dan mengambil tas berisi alat gambar serta laptop kerjanya. Ia berjalan kaki menuju halte bus terdekat, melewati jalanan yang mulai ramai oleh pedagang pagi. Perjalanan menuju stasiun tua itu memakan waktu hampir empat puluh menit dari apartemennya. Selama perjalanan, Wening membaca ulang berkas proyek yang diberikan atasannya kemarin sore. Stasiun kereta itu sudah tidak dipakai sejak lima belas tahun lalu, sejak jalur baru dibangun memutar kota. Dokumen itu menyebutkan bahwa bangunan tersebut akan dirobohkan untuk membangun pusat perbelanjaan modern. Wening merasa sedikit sedih membaca rencana itu, meski ia tahu ini bagian dari pekerjaannya. Ia turun dari bus di halte terakhir dan harus berjalan kaki sekitar sepuluh menit lagi. Jalan menuju stasiun itu dipenuhi rerumputan liar yang tumbuh di antara rel-rel yang sudah berkarat. Semakin dekat, Wening bisa melihat bangunan stasiun yang catnya sudah pudar dan beberapa jendelanya pecah. Ada keindahan tersendiri dalam kerusakan itu, pikirnya sambil mengeluarkan kamera untuk memotret. Ia mulai berjalan mengelilingi bangunan, mencatat kondisi struktur untuk laporan awal proyeknya. Atap stasiun masih terlihat kokoh meski beberapa gentingnya sudah lepas dan jatuh ke tanah. Dinding-dinding batu bata merah masih berdiri tegak meski ditumbuhi lumut di beberapa bagian. Wening masuk ke dalam gedung utama melalui pintu yang sudah tidak terkunci lagi. Debu tebal menutupi lantai dan bangku-bangku tua yang masih tersusun rapi di sana. Cahaya matahari pagi masuk melalui jendela-jendela besar, menciptakan garis-garis cahaya yang indah. Wening berhenti sejenak, terpana oleh suasana yang terasa seperti kapsul waktu dari masa lalu. Ia melangkah menuju peron utama, tempat dulu penumpang menunggu kereta yang akan datang. Di sanalah ia pertama kali melihat sosok seorang lelaki tua duduk sendirian di bangku kayu. Lelaki itu mengenakan topi fedora tua dan jaket rajut yang terlihat sudah dipakai bertahun-tahun. Wening terkejut, tidak menyangka akan bertemu seseorang di bangunan yang sudah lama ditinggalkan ini. Ia mendekat perlahan, berusaha tidak mengagetkan lelaki tua tersebut. “Permisi, Pak, apa boleh saya tahu sedang apa di sini?” tanya Wening dengan sopan. Lelaki tua itu menoleh perlahan, matanya yang sudah mulai sayu menatap Wening dengan tenang. “Saya menunggu,” jawabnya singkat, suaranya terdengar parau namun penuh ketenangan. Wening mengernyitkan dahi, bingung dengan jawaban yang terdengar aneh baginya. “Menunggu apa, Pak? Kereta sudah tidak beroperasi lagi di jalur ini sejak lama,” kata Wening. Lelaki itu tersenyum tipis, seolah pertanyaan itu sudah sering ia dengar sebelumnya. “Saya bukan menunggu kereta,” katanya pelan, “saya menunggu seseorang yang berjanji akan kembali lewat jalur ini.” Wening duduk di bangku seberangnya, rasa penasaran mengalahkan niatnya untuk segera bekerja. “Nama saya Wening, saya arsitek yang ditugaskan untuk proyek di stasiun ini,” katanya memperkenalkan diri. Lelaki tua itu mengangguk pelan, “Nama saya Darmo. Saya sudah di sini lebih lama dari yang kau kira.” Wening bertanya lebih lanjut, penasaran dengan siapa sebenarnya yang ditunggu oleh Pak Darmo. Pak Darmo menghela napas panjang sebelum mulai bercerita tentang istrinya yang bernama Sulastri. Sulastri adalah seorang perawat yang bekerja di kota ini puluhan tahun lalu, sebelum sebuah wabah besar melanda. “Empat puluh tahun lalu, ada wabah yang sangat parah menyerang kota-kota di sekitar sini,” kata Pak Darmo. Sulastri dikirim bertugas ke kota tetangga untuk membantu menangani pasien yang terus bertambah setiap hari. Sebelum berangkat, mereka berjanji bahwa Sulastri akan pulang naik kereta terakhir dari jalur tersebut. Namun kereta itu tak pernah datang, karena jalur itu ditutup mendadak akibat kerusakan rel yang parah. Pak Darmo menceritakan bagaimana ia menunggu di peron itu hari demi hari tanpa kabar apa pun. Wening mendengarkan dengan seksama, merasakan kepedihan yang masih terasa jelas dalam suara Pak Darmo. “Sejak itu, saya percaya bahwa selama stasiun ini masih berdiri, janji itu belum benar-benar berakhir,” kata Pak Darmo. Wening terdiam, tidak tahu harus berkata apa mendengar kisah yang begitu menyentuh tersebut. Ia menatap peron kosong itu, membayangkan betapa banyak hari yang dihabiskan Pak Darmo menunggu di sana. Matahari semakin tinggi, namun Wening tidak lagi memikirkan pekerjaan yang seharusnya ia selesaikan hari itu. Ia memutuskan untuk duduk lebih lama, mendengarkan lebih banyak cerita dari lelaki tua yang baru ia kenal. Pak Darmo bercerita tentang bagaimana ia dan Sulastri dulu sering menghabiskan waktu di stasiun ini sebelum keberangkatannya. Mereka pernah berjanji akan membangun rumah kecil tidak jauh dari stasiun setelah Sulastri kembali bertugas. Wening merasa tersentuh mendengar kisah cinta yang begitu sederhana namun penuh kesetiaan itu. Ketika sore mulai menjelang, Wening berpamitan kepada Pak Darmo dan berjanji akan kembali esok hari. Dalam perjalanan pulang, pikirannya terus dipenuhi oleh kisah Pak Darmo dan stasiun tua tersebut. Ia menyadari bahwa bangunan ini bukan sekadar struktur kosong yang harus dirobohkan untuk proyek pembangunan. Malam itu, Wening duduk di apartemennya, menatap berkas proyek pembongkaran dengan perasaan yang berbeda. Ia membuka laptopnya dan mulai menulis catatan tambahan tentang apa yang ia temukan hari itu. Entah mengapa, ia merasa perlu untuk menunda sedikit laporan resminya kepada atasan. Wening memutuskan untuk kembali lagi besok pagi, ingin mendengar lebih banyak cerita dari Pak Darmo. Hari demi hari, Wening terus kembali ke stasiun itu setiap sore untuk menggambar reruntuhannya dan mendengarkan cerita Pak Darmo. BABAK DUA. Wening, yang sedang berjuang dengan keputusan besar dalam hidupnya sendiri soal karier dan keluarganya di kota lain, mulai melihat stasiun itu bukan sekadar bangunan tua, tapi sebuah tempat di mana orang-orang menyimpan janji yang belum sempat ditepati. Ia menunda laporan pembongkarannya, dan diam-diam mulai mengumpulkan kisah-kisah dari warga sekitar tentang stasiun itu: seorang anak yang berjanji akan membawa pulang kakaknya yang merantau, sepasang kekasih yang dulu berpisah di peron yang sama, seorang penjaga stasiun yang pensiun tapi tetap datang setiap pagi hanya untuk menyapu lantai yang sama. Wening menyadari bahwa stasiun itu menjadi semacam tempat suci kecil bagi penantian-penantian yang tak selesai. BABAK TIGA. Suatu malam, badai besar melanda kota, dan atap stasiun yang lapuk nyaris runtuh. Warga sekitar, termasuk Pak Darmo yang sudah renta, bergegas menyelamatkan apa yang tersisa dari bangunan itu, bukan karena nilai bangunannya, tapi karena nilai kenangan yang melekat padanya. Dalam kekacauan itu, Wening menemukan kotak tua di bawah lantai peron berisi surat-surat yang tak pernah terkirim, salah satunya ditulis oleh istri Pak Darmo sendiri, menjelaskan bahwa ia sebenarnya telah berusaha pulang, namun jatuh sakit di perjalanan dan tak pernah sembuh. Surat itu tak pernah sampai karena pengantar pos saat itu juga terjebak wabah. Wening membawa surat itu kepada Pak Darmo keesokan paginya, dengan tangan gemetar. Pak Darmo membacanya perlahan, air matanya jatuh, namun di wajahnya ada ketenangan yang belum pernah dilihat Wening sebelumnya. “Akhirnya aku tahu,” katanya, “dia tidak pernah mengingkari janjinya. Waktu saja yang tidak berpihak padanya.” Hari itu, Pak Darmo untuk pertama kalinya meninggalkan peron stasiun dengan hati yang lega, bukan karena berhenti menunggu, tapi karena penantiannya akhirnya punya jawaban. Wening mengajukan proposal baru kepada kotanya: bukan merobohkan stasiun itu, melainkan menjadikannya museum kecil berisi surat-surat dan kisah penantian warga kota, sebagai pengingat bahwa beberapa bangunan tua menyimpan sesuatu yang lebih berharga daripada tanah yang ditempatinya. Proyek itu disetujui setelah perdebatan panjang di balai kota, dan setahun kemudian, stasiun tua itu dibuka kembali, bukan untuk kereta, tapi untuk orang-orang yang ingin mengenang. Pak Darmo, yang kini menjadi penjaga museum kecil itu, masih duduk di peron yang sama setiap sore, namun kini dengan senyum, menyambut siapa pun yang datang untuk mendengar kisah-kisah penantian yang akhirnya menemukan tempatnya. Film ini ditutup dengan Wening berdiri di peron yang sama saat senja turun, menatap rel yang kini ditumbuhi bunga liar, menyadari bahwa pekerjaannya sebagai arsitek bukan hanya membangun gedung baru, tapi kadang juga menjaga agar kenangan punya tempat untuk tetap hidup.",

function sleep(ms){ return new Promise(r => setTimeout(r, ms)); }

async function typeLine(text){
  let cur = "";
  const row = document.createElement('div');
  term.appendChild(row);
  for(const ch of text){
    cur += ch;
    row.innerHTML = "> " + cur + "<span class='cursor'>&nbsp;</span>";
    term.scrollTop = term.scrollHeight;
    await sleep(15 + Math.random()*25);
  }
  row.innerHTML = "> " + cur;
}

async function run(){
  btn.disabled = true; menuBtns.forEach(m => m.disabled = true);
  term.innerHTML = "";
  bar.style.width = "0%";
  pct.textContent = "0%";

  for(let i=0; i<lines.length; i++){
    await typeLine(lines[i]);
    const p = Math.round(((i+1)/lines.length)*100);
    bar.style.width = p + "%";
    pct.textContent = p + "%";
    await sleep(250);
  }

  const done = document.createElement('div');
  done.style.marginTop = "10px";
  done.style.color = "#0f0";
  done.style.textShadow = "0 0 10px #0f0";
  done.textContent = modes[currentMode].done;
  term.appendChild(done);

  btn.disabled = false; menuBtns.forEach(m => m.disabled = false);
  btn.textContent = "ULANGI";
}

function renderMangaPanels(text, container, seriesTitle){
  const sentences = text.replace(/([.!?]+["”]?)\s+(?=["“A-Z0-9—])/g, '$1\u0001').split('\u0001').filter(x => x.trim().length > 0);
  container.innerHTML = '';
  const icons = charSVG[seriesTitle] || [];
  let current = 0;

  const bookWrap = document.createElement('div');
  bookWrap.className = 'manga-page';
  bookWrap.style.minHeight = '220px';
  const pageBody = document.createElement('div');
  const nav = document.createElement('div');
  nav.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-top:10px;';
  const prevBtn = document.createElement('button');
  prevBtn.textContent = '← Sebelumnya';
  prevBtn.style.cssText = 'margin:0;font-size:11px;padding:6px 10px;';
  const nextBtn = document.createElement('button');
  nextBtn.textContent = 'Berikutnya →';
  nextBtn.style.cssText = 'margin:0;font-size:11px;padding:6px 10px;';
  const counter = document.createElement('div');
  counter.style.cssText = 'font-size:11px;color:#111;font-family:Georgia,serif;';

  function renderPage(){
    pageBody.innerHTML = '';
    const icon = icons.length ? icons[current % icons.length] : '';
    const panel = document.createElement('div');
    panel.className = 'manga-panel';
    panel.style.minHeight = '160px';
    panel.innerHTML = '<div class="pnum">Halaman ' + (current+1) + '</div>' +
      (icon ? '<div style="text-align:center;margin-bottom:8px;" class="char-halftone">' + icon + '</div>' : '') +
      '';
    const bub = document.createElement('div'); bub.className = 'manga-bubble'; bub.textContent = sentences[current].trim(); panel.appendChild(bub);
    pageBody.appendChild(panel);
    counter.textContent = (current+1) + ' / ' + sentences.length;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === sentences.length - 1;
    prevBtn.style.opacity = prevBtn.disabled ? '0.3' : '1';
    nextBtn.style.opacity = nextBtn.disabled ? '0.3' : '1';
  }

  prevBtn.addEventListener('click', () => { if(current>0){ current--; renderPage(); } });
  nextBtn.addEventListener('click', () => { if(current<sentences.length-1){ current++; renderPage(); } });

  nav.appendChild(prevBtn);
  nav.appendChild(counter);
  nav.appendChild(nextBtn);
  bookWrap.appendChild(pageBody);
  bookWrap.appendChild(nav);
  container.appendChild(bookWrap);
  renderPage();
}

function renderAnimeList(){
  const box = document.getElementById('animeBox');
  const seriesList = document.getElementById('seriesList');
  const epList = document.getElementById('epList');
  const epStory = document.getElementById('epStory');
  const backBtn = document.getElementById('backBtn');
  box.style.display = 'block';
  epStory.style.display = 'none';
  epList.style.display = 'none';
  backBtn.style.display = 'none';
  seriesList.style.display = 'flex';
  seriesList.innerHTML = '';

  modes.animeSeries.forEach(series => {
    const b = document.createElement('button');
    b.innerHTML = series.title + '<br><span style="font-weight:normal;font-size:10px;opacity:.7;">' + series.desc + '</span>';
    b.style.cssText = 'margin:0;text-align:left;font-size:12px;line-height:1.4;';
    b.addEventListener('click', () => {
      seriesList.style.display = 'none';
      epList.style.display = 'flex';
      epList.innerHTML = '';
      backBtn.style.display = 'block';
      series.episodes.forEach(ep => {
        const eb = document.createElement('button');
        eb.textContent = ep.t;
        eb.style.cssText = 'margin:0;text-align:left;font-size:12px;';
        eb.addEventListener('click', () => {
          renderMangaPanels(ep.s, epStory, series.title);
          epStory.style.display = 'block';
        });
        epList.appendChild(eb);
      });
    });
    seriesList.appendChild(b);
  });

  backBtn.onclick = () => {
    epList.style.display = 'none';
    epStory.style.display = 'none';
    backBtn.style.display = 'none';
    seriesList.style.display = 'flex';
  };
}

function resizeImage(file){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85).split(',')[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject({ code: 'img', message: 'gambar tidak bisa dibaca' }); };
    img.src = url;
  });
}

async function apiSample(messages, opts){
  const body = { messages: messages.slice(-20) };
  if(opts && opts.images && opts.images.length) body.image = { media_type: 'image/jpeg', data: await resizeImage(opts.images[0]) };
  let res;
  try{
    res = await fetch('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  }catch(e){ throw { code: 'network', message: 'koneksi gagal, coba lagi' }; }
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw { code: res.status, message: data.message || 'server sedang bermasalah' };
  return { text: data.text || '(jawaban kosong)' };
}

const aiChat = document.getElementById('aiChat');
const aiInput = document.getElementById('aiInput');
const aiSendBtn = document.getElementById('aiSendBtn');
const aiImgInput = document.getElementById('aiImgInput');
const imgPreview = document.getElementById('imgPreview');
const chatListEl = document.getElementById('chatList');
const newChatBtn = document.getElementById('newChatBtn');

let pendingImage = null;
let chatStore = { chats: [], activeId: null };

function loadChatStore(){
  try{
    const raw = localStorage.getItem('hilxiter_ai_chats');
    if(raw) chatStore = JSON.parse(raw);
  }catch(e){}
  if(!chatStore.chats || chatStore.chats.length === 0){
    const id = 'c' + Date.now();
    chatStore = { chats: [{ id, title: 'Chat 1', messages: [] }], activeId: id };
  }
  if(!chatStore.activeId) chatStore.activeId = chatStore.chats[0].id;
}

function saveChatStore(){
  try{ localStorage.setItem('hilxiter_ai_chats', JSON.stringify(chatStore)); }catch(e){}
}

function getActiveChat(){
  return chatStore.chats.find(c => c.id === chatStore.activeId) || chatStore.chats[0];
}

function renderChatList(){
  chatListEl.innerHTML = '';
  chatStore.chats.forEach(c => {
    const b = document.createElement('button');
    b.textContent = c.title;
    b.style.cssText = 'margin:0;font-size:10px;padding:6px 4px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;' +
      (c.id === chatStore.activeId ? 'background:var(--fg);color:#000;' : '');
    b.addEventListener('click', () => {
      chatStore.activeId = c.id;
      saveChatStore();
      renderChatList();
      renderMessages();
    });
    chatListEl.appendChild(b);
  });
}

function renderMessages(){
  aiChat.innerHTML = '';
  const chat = getActiveChat();
  chat.messages.forEach(m => addChatBubble(m.text, m.who, false));
  aiChat.scrollTop = aiChat.scrollHeight;
}

function addChatBubble(text, who, save){
  const b = document.createElement('div');
  b.style.cssText = who === 'user'
    ? 'align-self:flex-end;background:#063;color:#fff;padding:8px 12px;border-radius:8px;max-width:85%;font-size:12px;'
    : 'align-self:flex-start;background:#111;color:var(--fg);padding:8px 12px;border-radius:8px;max-width:85%;font-size:12px;white-space:pre-wrap;';
  b.textContent = text;
  aiChat.appendChild(b);
  aiChat.scrollTop = aiChat.scrollHeight;
  if(save !== false){
    getActiveChat().messages.push({text, who});
    saveChatStore();
  }
  return b;
}

newChatBtn.addEventListener('click', () => {
  const id = 'c' + Date.now();
  chatStore.chats.push({ id, title: 'Chat ' + (chatStore.chats.length + 1), messages: [] });
  chatStore.activeId = id;
  saveChatStore();
  renderChatList();
  renderMessages();
});

document.getElementById('delChatBtn').addEventListener('click', () => {
  if(!confirm('Hapus chat ini?')) return;
  chatStore.chats = chatStore.chats.filter(c => c.id !== chatStore.activeId);
  if(!chatStore.chats.length){ const id = 'c' + Date.now(); chatStore.chats.push({ id, title: 'Chat 1', messages: [] }); }
  chatStore.activeId = chatStore.chats[0].id;
  saveChatStore(); renderChatList(); renderMessages();
});

aiImgInput.addEventListener('change', () => {
  const file = aiImgInput.files[0];
  if(!file) return;
  if(file.size > 15*1024*1024){ alert('Ukuran gambar maksimal 15 MB.'); aiImgInput.value = ''; return; }
  pendingImage = file;
  imgPreview.style.display = 'block';
  imgPreview.innerHTML = '';
  const img = document.createElement('img');
  img.src = URL.createObjectURL(file);
  img.style.cssText = 'max-height:60px;border-radius:4px;border:1px solid var(--dim);';
  const rm = document.createElement('button');
  rm.textContent = '✕';
  rm.style.cssText = 'margin-left:6px;padding:2px 8px;font-size:10px;';
  rm.addEventListener('click', () => { pendingImage = null; imgPreview.style.display = 'none'; aiImgInput.value = ''; });
  imgPreview.appendChild(img);
  imgPreview.appendChild(rm);
});

let sending = false;
async function sendAiQuestion(){
  if(sending) return;
  const q = aiInput.value.trim();
  const hasImg = !!pendingImage;
  if(!q && !hasImg) return;
  addChatBubble(q || '(mengirim gambar)', 'user');
  { const ch = getActiveChat(); if(ch.messages.length === 1 && q){ ch.title = q.slice(0,18); saveChatStore(); renderChatList(); } }
  aiInput.value = '';
  const imgToSend = pendingImage;
  pendingImage = null;
  imgPreview.style.display = 'none';
  aiImgInput.value = '';
  const chatHistory = getActiveChat().messages.slice(0, -1).map(m => ({
    role: m.who === 'user' ? 'user' : 'assistant', content: m.text
  }));
  const input = chatHistory.concat([{ role: 'user', content: q || 'Tolong deskripsikan gambar ini.' }]);
  sending = true; aiSendBtn.disabled = true;
  const thinkingBubble = addChatBubble('Berpikir...', 'ai', false);
  try{
    const opts = { onText: ({text}) => { thinkingBubble.textContent = text; aiChat.scrollTop = aiChat.scrollHeight; } };
    if(imgToSend) opts.images = [imgToSend];
    const fn = apiSample;
    const res = await fn(input, opts);
    thinkingBubble.textContent = res.text;
    getActiveChat().messages.push({ text: res.text, who: 'ai' });
    saveChatStore();
  }catch(err){
    const msg = 'Maaf, ' + (err && err.message ? err.message : 'gagal mendapat jawaban') + '.';
    thinkingBubble.textContent = msg;
    getActiveChat().messages.push({ text: msg, who: 'ai' });
    saveChatStore();
  }finally{ sending = false; aiSendBtn.disabled = false; }
}

aiSendBtn.addEventListener('click', sendAiQuestion);
aiInput.addEventListener('keydown', e => { if(e.key === 'Enter') sendAiQuestion(); });

loadChatStore();
renderChatList();
renderMessages();
</script>
</body>
</html>
